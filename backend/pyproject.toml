[project]
name = "fleetpulse-backend"
version = "0.1.0"
description = "FleetPulse API and background workers"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.123",
    "celery>=5.6.3",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "fpdf2>=2.9.0",
    "geoalchemy2>=0.20.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.6",
    "sqlmodel>=0.0.48",
    "structlog>=26.1.0",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501", "S608"]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: needs the real PostGIS and Redis services (run with -m integration)",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
